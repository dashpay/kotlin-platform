language = "C++"
autogen_warning = "/* This file is autogenerated by cbindgen. Don't modify this manually. */"
braces = "SameLine"
line_length = 80
tab_width = 4
documentation_style = "c"
style = "tag"
include_guard = "rs_sdk_bindings"
after_includes = """
#ifndef SWIG
using KeyID = uint32_t;
using Purpose = uint8_t;
using SecurityLevel = uint8_t;
using KeyType = uint8_t;
#endif
"""

[parse]
parse_deps = true
include = []
extra_bindings = []

[enum]
prefix_with_name = false

[export]
exclude = ["__android_log_write"]
