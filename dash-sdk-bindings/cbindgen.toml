enum class dpp_identity_identity_public_key_security_level_SecurityLevel;
enum class dpp_identity_identity_public_key_key_type_KeyType;
using KeyID = dpp_identity_identity_public_key_KeyID;
using Purpose = dpp_identity_identity_public_key_purpose_Purpose;
using SecurityLevel = dpp_identity_identity_public_key_security_level_SecurityLevel;
using KeyType = dpp_identity_identity_public_key_key_type_KeyType;
#endif
"""

[parse]
parse_deps = true
include = ["platform-mobile"]
extra_bindings = ["platform-mobile"]

[enum]
prefix_with_name = false
enum_class = true

[export]
exclude = ["__android_log_write"]
