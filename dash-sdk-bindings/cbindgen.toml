language = "C++"
autogen_warning = "/* This file is autogenerated by cbindgen. Don't modify this manually. */"
braces = "SameLine"
line_length = 80
tab_width = 4
documentation_style = "c"
style = "tag"
include_guard = "dash_sdk_bindings_h"
after_includes = """
#ifndef SWIG
// V1 fields point to native Rust repr(u8) enums, not Ferment's repr(C) enums.
using KeyID = uint32_t;
using Purpose = uint8_t;
using SecurityLevel = uint8_t;
using KeyType = uint8_t;
#endif
"""

[parse]
parse_deps = true
include = ["platform-mobile"]
extra_bindings = ["platform-mobile"]

[enum]
prefix_with_name = false
enum_class = true

[export]
exclude = ["__android_log_write"]
